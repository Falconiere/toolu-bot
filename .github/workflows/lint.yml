name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10,tokei@15.0.0,ast-grep@0.51.0
      - run: cargo fmt --all --check
      - run: dx fmt --check
      - name: Max 400 code lines per .rs file (comments and blanks excluded)
        run: |
          tokei . --types Rust --files --output json | jq -n -r 'input | [.Rust.reports[] | select(.stats.code > 400) | "\(.name): \(.stats.code) code lines (max 400)"] | if length > 0 then (join("\n") + "\n" | halt_error(1)) else empty end'
      - name: Max 50 code lines per function body, incl. components (comments and blanks excluded)
        run: |
          ast-grep scan --rule lint/fn-body.yml --json=compact packages | jq -n -r 'input | [.[] | (.text | split("\n") | map(select(test("^\\s*(//|/\\*|\\*|$)") | not)) | length - 2) as $n | select($n > 50) | "\(.file):\(.range.start.line + 1): function body has \($n) code lines (max 50)"] | if length > 0 then (join("\n") + "\n" | halt_error(1)) else empty end'
      - name: No #[expect], #[ignore] or #[rustfmt::skip]
        run: |
          ! git grep -nE '^[[:space:]]*#!?\[[[:space:]]*(cfg_attr\(.*)?(expect|ignore|rustfmt::skip)([^[:alnum:]_]|$)' -- '*.rs'
      - run: cargo clippy --workspace --all-targets

  css-json-toml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes oxfmt@0.76.0 --check
